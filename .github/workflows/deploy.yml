name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ------------------------------------------------------------------
  # 前端 → Vercel（生产）
  # 需要 Secrets：VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID
  # 还需要在 Vercel 项目「Environment Variables (Production)」里设置
  #   VITE_API_BASE = https://<你的 backend 服务域名>.onrender.com
  # ------------------------------------------------------------------
  deploy-frontend:
    name: Deploy frontend (Vercel)
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: frontend

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: frontend

      - name: Deploy to production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: frontend

  # ------------------------------------------------------------------
  # 后端 + Cube.js → Render
  # 方式一（推荐）：Render 已连接本仓库时，push 会自动部署，无需此 job。
  # 方式二：在 Render 各服务里生成 Deploy Hook，存为下面的 Secrets 后触发。
  #   RENDER_CUBEJS_DEPLOY_HOOK / RENDER_BACKEND_DEPLOY_HOOK
  # ------------------------------------------------------------------
  deploy-backend:
    name: Deploy backend + Cube.js (Render)
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cube.js deploy
        run: curl -fsS -X POST "${{ secrets.RENDER_CUBEJS_DEPLOY_HOOK }}"
      - name: Trigger backend deploy
        run: curl -fsS -X POST "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}"
